<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<title>QR Code Generator - LocalForge</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="js/components.js"></script>
  <link rel="stylesheet" href="css/tailwind.generated.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode img {
      max-width: 100%;
      height: auto;
    }

    .color-picker-wrapper {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #e2e8f0;
    }

    .color-picker-wrapper input[type="color"] {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        cursor: pointer;
    }
</style>
<style>
local-sidebar:not(:defined), local-header:not(:defined) {
  opacity: 0;
}
local-sidebar:defined, local-header:defined {
  animation: fadeIn 0.3s ease-in-out;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* Prevent flash of wrong theme */
html {
  color-scheme: light dark;
}

html.dark {
  color-scheme: dark;
}

/* Smooth theme transitions */
*, *::before, *::after {
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, fill 0.3s ease, stroke 0.3s ease;
}

/* Disable transitions during page load */
.preload * {
  transition: none !important;
}@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
</style>
<script>
(function() {
  const savedMode = localStorage.getItem('lifeflow_theme_mode') || 'auto';
  let isDark = false;
  if (savedMode === 'auto') {
    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  } else {
    isDark = savedMode === 'dark';
  }
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
})();
</script>
</head>

<body class="preload bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-200 font-sans h-screen flex overflow-hidden transition-colors duration-300"
  >
<script>
window.addEventListener('load', function() {
  setTimeout(function() {
    document.body.classList.remove('preload');
  }, 100);
});
</script>

  <local-sidebar></local-sidebar>

  <div class="flex-1 flex flex-col min-w-0">
    <local-header title="QR Code Generator">
      <i slot="icon" class="fas fa-qrcode text-indigo-500"></i>
      <div slot="actions" class="text-xs text-slate-500 dark:text-slate-400">Generate customizable QR codes</div>
    </local-header>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
      <!-- Left Panel: Input & Settings -->
      <aside class="w-96 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col overflow-y-auto">
        <div class="p-6 space-y-6">
          <!-- Content Input -->
          <div>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Content</h3>
            <textarea id="qrContent" rows="4" placeholder="Enter text, URL, or any data..."
              class="w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-700 resize-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
          </div>

          <!-- Type Tabs -->
          <div>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Quick Types</h3>
            <div class="grid grid-cols-4 gap-2">
              <button class="qr-type-btn p-2 rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition text-center" data-type="text">
                <i class="fas fa-font text-lg mb-1 block text-slate-600"></i>
                <span class="text-xs">Text</span>
              </button>
              <button class="qr-type-btn p-2 rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition text-center" data-type="url">
                <i class="fas fa-link text-lg mb-1 block text-blue-500"></i>
                <span class="text-xs">URL</span>
              </button>
              <button class="qr-type-btn p-2 rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition text-center" data-type="email">
                <i class="fas fa-envelope text-lg mb-1 block text-red-500"></i>
                <span class="text-xs">Email</span>
              </button>
              <button class="qr-type-btn p-2 rounded-lg border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-700 transition text-center" data-type="wifi">
                <i class="fas fa-wifi text-lg mb-1 block text-green-500"></i>
                <span class="text-xs">WiFi</span>
              </button>
            </div>
          </div>

          <!-- Dynamic Fields based on type -->
          <div id="dynamicFields"></div>

          <!-- Appearance Settings -->
          <div>
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Appearance</h3>

            <div class="space-y-4">
              <div class="flex items-center justify-between">
                <label class="text-sm">Size</label>
                <select id="qrSize" class="px-3 py-1 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-sm">
                  <option value="150">Small (150px)</option>
                  <option value="200" selected>Medium (200px)</option>
                  <option value="300">Large (300px)</option>
                  <option value="400">Extra Large (400px)</option>
                </select>
              </div>

              <div class="flex items-center justify-between">
                <label class="text-sm">Error Correction</label>
                <select id="qrLevel"
                  class="px-3 py-1 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-sm">
                  <option value="1">Low (L)</option>
                  <option value="0" selected>Medium (M)</option>
                  <option value="3">Quartile (Q)</option>
                  <option value="2">High (H)</option>
                </select>
              </div>

              <div class="flex items-center justify-between">
                <label class="text-sm">Foreground Color</label>
                <div class="color-picker-wrapper">
                  <input type="color" id="qrColor" value="#000000">
                </div>
              </div>

              <div class="flex items-center justify-between">
                <label class="text-sm">Background Color</label>
                <div class="color-picker-wrapper">
                  <input type="color" id="qrBgColor" value="#ffffff">
                </div>
              </div>
            </div>
          </div>

          <button id="generateBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition">
            <i class="fas fa-sync-alt mr-2"></i>Generate QR Code
          </button>
        </div>
      </aside>

      <!-- Right Panel: Preview -->
      <main class="flex-1 bg-slate-50 dark:bg-slate-900 flex flex-col items-center justify-center p-8">
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-8 shadow-lg">
          <div id="qrcode" class="mb-6"></div>

          <div class="flex gap-3 justify-center">
            <button id="downloadPng" class="px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded-lg text-sm font-medium transition">
              <i class="fas fa-download mr-2"></i>PNG
            </button>
            <button id="downloadSvg" class="px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded-lg text-sm font-medium transition">
              <i class="fas fa-download mr-2"></i>SVG
            </button>
          </div>
        </div>

        <p class="mt-6 text-sm text-slate-500 text-center max-w-md">
          QR codes can store URLs, text, contact info, WiFi credentials, and more. Scan with any QR code reader app.
        </p>
      </main>
    </div>
  </div>

  <script>
    const qrContent = document.getElementById('qrContent');
    const qrSize = document.getElementById('qrSize');
    const qrLevel = document.getElementById('qrLevel');
    const qrColor = document.getElementById('qrColor');
    const qrBgColor = document.getElementById('qrBgColor');
    const generateBtn = document.getElementById('generateBtn');
    const downloadPng = document.getElementById('downloadPng');
    const downloadSvg = document.getElementById('downloadSvg');
    const dynamicFields = document.getElementById('dynamicFields');

    let currentQR = null;

    // Type handlers
    document.querySelectorAll('.qr-type-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        showDynamicFields(type);
      });
    });

    function showDynamicFields(type) {
      dynamicFields.innerHTML = '';

      if (type === 'url') {
        qrContent.placeholder = 'https://example.com';
      } else if (type === 'email') {
        dynamicFields.innerHTML = `
          <div class="space-y-3">
            <input type="email" id="emailAddr" placeholder="email@example.com" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">
            <input type="text" id="emailSubject" placeholder="Subject (optional)" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">
            <textarea id="emailBody" rows="2" placeholder="Body (optional)" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 resize-none"></textarea>
          </div>
        `;
        qrContent.placeholder = 'Email will be generated from fields above';
        qrContent.disabled = true;
      } else if (type === 'wifi') {
        dynamicFields.innerHTML = `
          <div class="space-y-3">
            <input type="text" id="wifiSsid" placeholder="Network Name (SSID)" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">
            <input type="password" id="wifiPass" placeholder="Password" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">
            <select id="wifiType" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">
              <option value="WPA">WPA/WPA2</option>
              <option value="WEP">WEP</option>
              <option value="nopass">No Password</option>
            </select>
          </div>
        `;
        qrContent.placeholder = 'WiFi config will be generated from fields above';
        qrContent.disabled = true;
      } else {
        qrContent.placeholder = 'Enter text, URL, or any data...';
        qrContent.disabled = false;
      }
    }

    function getQRContent() {
      if (!qrContent.disabled) {
        return qrContent.value;
      }

      // Handle dynamic fields
      const wifiSsid = document.getElementById('wifiSsid');
      if (wifiSsid) {
        const ssid = wifiSsid.value;
        const pass = document.getElementById('wifiPass').value;
        const type = document.getElementById('wifiType').value;
        return `WIFI:S:${ssid};T:${type};P:${pass};;`;
      }

      const emailAddr = document.getElementById('emailAddr');
      if (emailAddr) {
        const to = emailAddr.value;
        const subject = document.getElementById('emailSubject').value;
        const body = document.getElementById('emailBody').value;
        return `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      }

      return qrContent.value;
    }

    function generateQR() {
      const content = getQRContent();
      if (!content.trim()) return;

      const container = document.getElementById('qrcode');
      container.innerHTML = '';

      currentQR = new QRCode(container, {
        text: content,
        width: parseInt(qrSize.value),
        height: parseInt(qrSize.value),
        colorDark: qrColor.value,
        colorLight: qrBgColor.value,
        correctLevel: parseInt(qrLevel.value)
      });
    }

    // Generate on input change
    let debounceTimer;
    qrContent.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(generateQR, 500);
    });

    generateBtn.addEventListener('click', generateQR);

    // Settings change
    [qrSize, qrLevel, qrColor, qrBgColor].forEach(el => {
      el.addEventListener('change', () => {
        if (qrContent.value.trim()) {
          generateQR();
        }
      });
    });

    // Download handlers
    downloadPng.addEventListener('click', () => {
      const img = document.querySelector('#qrcode img');
      if (img) {
        const link = document.createElement('a');
        link.download = 'qrcode.png';
        link.href = img.src;
        link.click();
      }
    });

    downloadSvg.addEventListener('click', () => {
      const canvas = document.querySelector('#qrcode canvas');
      if (canvas) {
        // Convert canvas to blob and download
        canvas.toBlob(blob => {
          const link = document.createElement('a');
          link.download = 'qrcode.png';
          link.href = URL.createObjectURL(blob);
          link.click();
        });
      }
    });

    // Initial generation
    qrContent.value = 'https://localforge.app';
    generateQR();
  </script>
</body>

</html>
