<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<link rel="preconnect" href="https://cdn.tailwindcss.com">
<link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<title>Base64 Tools - LocalForge</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com" defer></script>
<script>
window.tailwindConfig = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        slate: {
          850: '#1e293b',
        }
      }
    }
  }
};
Object.defineProperty(window, 'tailwind', {
  configurable: true,
  set: function(tw) {
    Object.defineProperty(window, 'tailwind', {
      value: tw,
      writable: true,
      configurable: true
    });
    tw.config = window.tailwindConfig;
  }
});
</script>
  <script type="module" src="js/components.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tab-active {
      border-bottom: 2px solid #06b6d4;
      color: #06b6d4;
    }

    .encoder-textarea {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    }
</style>
<style>
local-sidebar:not(:defined), local-header:not(:defined) {
  opacity: 0;
}
local-sidebar:defined, local-header:defined {
  animation: fadeIn 0.3s ease-in-out;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}


/* Prevent flash of wrong theme */
html {
  color-scheme: light dark;
}

html.dark {
  color-scheme: dark;
}

/* Smooth theme transitions */
*, *::before, *::after {
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, fill 0.3s ease, stroke 0.3s ease;
}

/* Disable transitions during page load */
.preload * {
  transition: none !important;
}@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
</style>
<script>
(function() {
  const savedMode = localStorage.getItem('lifeflow_theme_mode') || 'auto';
  let isDark = false;
  if (savedMode === 'auto') {
    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  } else {
    isDark = savedMode === 'dark';
  }
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
})();
</script>
</head>

<body class="preload bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-200 font-sans h-screen flex overflow-hidden transition-colors duration-300"
  >
<script>
window.addEventListener('load', function() {
  setTimeout(function() {
    document.body.classList.remove('preload');
  }, 100);
});
</script>

  <local-sidebar></local-sidebar>

  <div class="flex-1 flex flex-col min-w-0">
    <local-header title="Base64 Tools">
      <i slot="icon" class="fas fa-code text-cyan-500"></i>
      <div slot="actions" class="text-xs text-slate-500 dark:text-slate-400">Encode and decode Base64 text & files</div>
    </local-header>

    <div class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
      <div class="flex">
        <button class="tab-btn px-6 py-3 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-cyan-500 transition tab-active" data-tab="text">
          <i class="fas fa-font mr-2"></i>Text
        </button>
        <button class="tab-btn px-6 py-3 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-cyan-500 transition" data-tab="file">
          <i class="fas fa-file mr-2"></i>File
        </button>
        <button class="tab-btn px-6 py-3 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-cyan-500 transition" data-tab="image">
          <i class="fas fa-image mr-2"></i>Image
        </button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-6">
      <!-- Text Tab -->
      <div id="text-tab" class="tab-content max-w-5xl mx-auto">
        <div class="grid grid-cols-2 gap-6">
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-medium text-slate-500">Plain Text</h3>
              <div class="flex gap-2">
                <button id="clearText" class="text-xs text-slate-400 hover:text-slate-600">
                  <i class="fas fa-trash-alt"></i>
                </button>
                <button id="pasteText" class="text-xs text-slate-400 hover:text-slate-600">
                  <i class="fas fa-paste"></i> Paste
                </button>
              </div>
            </div>
            <textarea id="plainText" class="encoder-textarea w-full h-64 px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-800 resize-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent" placeholder="Enter text to encode..."></textarea>
            <button id="encodeBtn" class="w-full py-3 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-medium transition">
              <i class="fas fa-arrow-down mr-2"></i>Encode to Base64
            </button>
          </div>

          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-medium text-slate-500">Base64</h3>
              <div class="flex gap-2">
                <button id="copyBase64" class="text-xs text-cyan-600 hover:text-cyan-700">
                  <i class="fas fa-copy"></i> Copy
                </button>
              </div>
            </div>
            <textarea id="base64Text" class="encoder-textarea w-full h-64 px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-800 resize-none focus:ring-2 focus:ring-cyan-500 focus:border-transparent" placeholder="Base64 output..."></textarea>
            <button id="decodeBtn" class="w-full py-3 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-medium transition">
              <i class="fas fa-arrow-up mr-2"></i>Decode from Base64
            </button>
          </div>
        </div>

        <div class="mt-8 p-4 bg-slate-100 dark:bg-slate-800 rounded-xl">
          <h3 class="text-sm font-medium text-slate-500 mb-2">URL Safe Mode</h3>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="urlSafe" class="w-4 h-4 text-cyan-600">
            <span class="text-sm">Use URL-safe Base64 (replaces + with -, / with _)</span>
          </label>
        </div>
      </div>

      <!-- File Tab -->
      <div id="file-tab" class="tab-content max-w-2xl mx-auto hidden">
        <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">
          <div id="fileDropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-12 text-center cursor-pointer hover:border-cyan-400 transition">
            <i class="fas fa-cloud-upload-alt text-4xl text-cyan-500 mb-4"></i>
            <p class="text-slate-600 dark:text-slate-400">Drop file here or click to select</p>
            <p class="text-xs text-slate-400 mt-2">Any file type supported</p>
            <input type="file" id="fileInput" class="hidden">
          </div>

          <div id="fileResult" class="hidden mt-6 space-y-4">
            <div class="flex items-center gap-4 p-4 bg-slate-50 dark:bg-slate-900 rounded-lg">
              <i id="fileIcon" class="fas fa-file text-3xl text-slate-400"></i>
              <div class="flex-1">
                <p id="fileName" class="font-medium"></p>
                <p id="fileSize" class="text-sm text-slate-500"></p>
              </div>
              <button id="removeFile" class="text-slate-400 hover:text-red-500">
                <i class="fas fa-times"></i>
              </button>
            </div>

            <div class="space-y-2">
              <div class="flex justify-between">
                <span class="text-sm font-medium">Base64 Output</span>
                <button id="copyFileBase64" class="text-sm text-cyan-600 hover:text-cyan-700">
                  <i class="fas fa-copy mr-1"></i>Copy
                </button>
              </div>
              <textarea id="fileBase64Output" class="encoder-textarea w-full h-32 px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 text-xs resize-none" readonly></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Image Tab -->
      <div id="image-tab" class="tab-content max-w-4xl mx-auto hidden">
        <div class="grid grid-cols-2 gap-6">
          <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">
            <h3 class="text-sm font-medium text-slate-500 mb-4">Image to Base64</h3>
            <div id="imageDropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl p-8 text-center cursor-pointer hover:border-cyan-400 transition mb-4">
              <i class="fas fa-image text-3xl text-cyan-500 mb-2"></i>
              <p class="text-sm text-slate-600 dark:text-slate-400">Drop image here</p>
              <input type="file" id="imageInput" class="hidden" accept="image/*">
            </div>
            <div id="imagePreviewContainer" class="hidden">
              <img id="imagePreview" class="max-w-full max-h-48 mx-auto rounded-lg mb-4">
              <textarea id="imageBase64" class="encoder-textarea w-full h-24 px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 text-xs resize-none" readonly></textarea>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">
            <h3 class="text-sm font-medium text-slate-500 mb-4">Base64 to Image</h3>
            <textarea id="base64ToImage" class="encoder-textarea w-full h-32 px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-800 resize-none mb-4" placeholder="Paste Base64 image data here..."></textarea>
            <button id="renderImage" class="w-full py-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-lg font-medium transition mb-4">
              <i class="fas fa-eye mr-2"></i>Render Image
            </button>
            <div id="renderedImageContainer" class="hidden text-center">
              <img id="renderedImage" class="max-w-full max-h-48 mx-auto rounded-lg">
              <a id="downloadImage" class="inline-block mt-4 px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded-lg text-sm transition">
                <i class="fas fa-download mr-2"></i>Download
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        btn.classList.add('tab-active');
        document.getElementById(btn.dataset.tab + '-tab').classList.remove('hidden');
      });
    });

    // Text encoding/decoding
    const plainText = document.getElementById('plainText');
    const base64Text = document.getElementById('base64Text');
    const urlSafe = document.getElementById('urlSafe');

    function toBase64(str) {
      const base64 = btoa(unescape(encodeURIComponent(str)));
      return urlSafe.checked ? base64.replace(/\\+/g, '-').replace(/\\//g, '_').replace(/=/g, '') : base64;
    }

    function fromBase64(str) {
      let base64 = str;
      if (urlSafe.checked) {
        base64 = base64.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
      }
      return decodeURIComponent(escape(atob(base64)));
    }

    document.getElementById('encodeBtn').addEventListener('click', () => {
      try {
        base64Text.value = toBase64(plainText.value);
      } catch (e) {
        alert('Error encoding: ' + e.message);
      }
    });

    document.getElementById('decodeBtn').addEventListener('click', () => {
      try {
        plainText.value = fromBase64(base64Text.value);
      } catch (e) {
        alert('Error decoding: ' + e.message);
      }
    });

    document.getElementById('clearText').addEventListener('click', () => {
      plainText.value = '';
      base64Text.value = '';
    });

    document.getElementById('pasteText').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        plainText.value = text;
      } catch (e) {
        alert('Could not access clipboard');
      }
    });

    document.getElementById('copyBase64').addEventListener('click', () => {
      if (base64Text.value) {
        navigator.clipboard.writeText(base64Text.value);
      }
    });

    // File handling
    const fileDropZone = document.getElementById('fileDropZone');
    const fileInput = document.getElementById('fileInput');
    const fileResult = document.getElementById('fileResult');

    fileDropZone.addEventListener('click', () => fileInput.click());
    fileDropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      fileDropZone.classList.add('border-cyan-400', 'bg-cyan-50', 'dark:bg-cyan-900/20');
    });
    fileDropZone.addEventListener('dragleave', () => {
      fileDropZone.classList.remove('border-cyan-400', 'bg-cyan-50', 'dark:bg-cyan-900/20');
    });
    fileDropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      fileDropZone.classList.remove('border-cyan-400', 'bg-cyan-50', 'dark:bg-cyan-900/20');
      if (e.dataTransfer.files.length > 0) {
        handleFile(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function handleFile(file) {
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = formatBytes(file.size);

      const reader = new FileReader();
      reader.onload = (e) => {
        const base64 = e.target.result.split(',')[1];
        document.getElementById('fileBase64Output').value = e.target.result;
        fileResult.classList.remove('hidden');
        fileDropZone.classList.add('hidden');
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('removeFile').addEventListener('click', () => {
      fileResult.classList.add('hidden');
      fileDropZone.classList.remove('hidden');
      fileInput.value = '';
    });

    document.getElementById('copyFileBase64').addEventListener('click', () => {
      const output = document.getElementById('fileBase64Output');
      if (output.value) {
        navigator.clipboard.writeText(output.value);
      }
    });

    // Image handling
    const imageDropZone = document.getElementById('imageDropZone');
    const imageInput = document.getElementById('imageInput');

    imageDropZone.addEventListener('click', () => imageInput.click());
    imageDropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      imageDropZone.classList.add('border-cyan-400');
    });
    imageDropZone.addEventListener('dragleave', () => {
      imageDropZone.classList.remove('border-cyan-400');
    });
    imageDropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      imageDropZone.classList.remove('border-cyan-400');
      if (e.dataTransfer.files.length > 0) {
        handleImage(e.dataTransfer.files[0]);
      }
    });
    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleImage(e.target.files[0]);
      }
    });

    function handleImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        document.getElementById('imagePreview').src = e.target.result;
        document.getElementById('imageBase64').value = e.target.result;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('renderImage').addEventListener('click', () => {
      const base64 = document.getElementById('base64ToImage').value.trim();
      if (base64) {
        const img = document.getElementById('renderedImage');
        img.src = base64.startsWith('data:') ? base64 : 'data:image/png;base64,' + base64;
        document.getElementById('renderedImageContainer').classList.remove('hidden');

        document.getElementById('downloadImage').onclick = () => {
          const link = document.createElement('a');
          link.href = img.src;
          link.download = 'decoded-image.png';
          link.click();
        };
      }
    });
  </script>
</body>

</html>
