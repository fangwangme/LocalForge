<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<title>JSON Tools - LocalForge</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<script type="module" src="js/components.js"></script>
  <link rel="stylesheet" href="css/tailwind.generated.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .json-input,
    .json-output {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    .tab-active {
      border-bottom: 2px solid #f59e0b;
      color: #f59e0b;
    }

    .json-key {
      color: #d946ef;
    }

    .json-string {
      color: #22c55e;
    }

    .json-number {
      color: #f59e0b;
    }

    .json-boolean {
      color: #3b82f6;
    }

    .json-null {
        color: #94a3b8;
    }
</style>
<style>
local-sidebar:not(:defined), local-header:not(:defined) {
  opacity: 0;
}
local-sidebar:defined, local-header:defined {
  animation: fadeIn 0.3s ease-in-out;
}
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* Prevent flash of wrong theme */
html {
  color-scheme: light dark;
}

html.dark {
  color-scheme: dark;
}

/* Smooth theme transitions */
*, *::before, *::after {
  transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, fill 0.3s ease, stroke 0.3s ease;
}

/* Disable transitions during page load */
.preload * {
  transition: none !important;
}@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
</style>
<script>
(function() {
  const savedMode = localStorage.getItem('lifeflow_theme_mode') || 'auto';
  let isDark = false;
  if (savedMode === 'auto') {
    isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  } else {
    isDark = savedMode === 'dark';
  }
    if (isDark) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
})();
</script>
</head>

<body class="preload bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-200 font-sans h-screen flex overflow-hidden transition-colors duration-300"
  >
<script>
window.addEventListener('load', function() {
  setTimeout(function() {
    document.body.classList.remove('preload');
  }, 100);
});
</script>

  <local-sidebar></local-sidebar>

  <div class="flex-1 flex flex-col min-w-0">
    <local-header title="JSON Tools">
      <i slot="icon" class="fas fa-code text-amber-500"></i>
      <div slot="actions" class="text-xs text-slate-500 dark:text-slate-400">Format, validate, and transform JSON</div>
    </local-header>

    <div class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
      <div class="flex">
        <button class="tab-btn px-6 py-3 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-amber-500 transition tab-active" data-tab="format">
          <i class="fas fa-align-left mr-2"></i>Format
        </button>
        <button class="tab-btn px-6 py-3 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-amber-500 transition" data-tab="validate">
          <i class="fas fa-check-circle mr-2"></i>Validate
        </button>
        <button class="tab-btn px-6 py-3 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-amber-500 transition" data-tab="convert">
          <i class="fas fa-exchange-alt mr-2"></i>Convert
        </button>
        <button class="tab-btn px-6 py-3 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-amber-500 transition" data-tab="tree">
          <i class="fas fa-sitemap mr-2"></i>Tree View
        </button>
      </div>
    </div>

    <div class="flex-1 flex overflow-hidden">
      <div id="format-tab" class="tab-content flex-1 flex">
        <div class="flex-1 flex flex-col p-4">
          <div class="flex gap-4 mb-4">
            <button id="pasteSample" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-sm transition">
              <i class="fas fa-paste mr-2"></i>Sample
            </button>
            <button id="clearJson" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-sm transition">
              <i class="fas fa-trash-alt mr-2"></i>Clear
            </button>
            <button id="copyJson" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm transition">
              <i class="fas fa-copy mr-2"></i>Copy
            </button>
            <button id="downloadJson" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm transition">
              <i class="fas fa-download mr-2"></i>Download
            </button>
          </div>

          <div class="flex gap-4 flex-1">
            <div class="flex-1 flex flex-col">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-slate-500">Input</span>
                <button id="minifyBtn" class="text-xs text-amber-600 hover:text-amber-700">Minify</button>
              </div>
              <textarea id="jsonInput" class="json-input flex-1 w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-800 resize-none focus:ring-2 focus:ring-amber-500 focus:border-transparent" placeholder="Paste your JSON here..."></textarea>
            </div>

            <div class="flex flex-col justify-center gap-2">
              <button id="formatBtn" class="w-12 h-12 bg-amber-500 hover:bg-amber-600 text-white rounded-full flex items-center justify-center transition">
                <i class="fas fa-arrow-right"></i>
              </button>
            </div>

            <div class="flex-1 flex flex-col">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-slate-500">Formatted Output</span>
                <div class="flex gap-2">
                  <select id="indentSize" class="text-xs px-2 py-1 border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-700">
                    <option value="2">2 spaces</option>
                    <option value="4">4 spaces</option>
                    <option value="\t">Tab</option>
                  </select>
                </div>
              </div>
              <textarea id="jsonOutput" class="json-output flex-1 w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 resize-none" readonly></textarea>
            </div>
          </div>

          <div id="statusBar" class="mt-4 p-3 bg-slate-100 dark:bg-slate-800 rounded-lg text-sm flex items-center justify-between">
            <span id="statusText">Ready</span>
            <span id="statsText"></span>
          </div>
        </div>
      </div>

      <div id="validate-tab" class="tab-content flex-1 flex hidden">
        <div class="flex-1 flex flex-col p-4">
          <div class="flex gap-4 mb-4">
            <button id="validateBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm transition">
              <i class="fas fa-check-circle mr-2"></i>Validate
            </button>
            <button id="clearValidate" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-lg text-sm transition">
              <i class="fas fa-trash-alt mr-2"></i>Clear
            </button>
          </div>

          <div class="flex gap-4 flex-1">
            <div class="flex-1 flex flex-col">
              <textarea id="validateInput" class="json-input flex-1 w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-800 resize-none" placeholder="Paste JSON to validate..."></textarea>
            </div>
            <div class="w-80 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-4 overflow-y-auto">
              <h3 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3">Validation Result</h3>
              <div id="validationResult">
                <p class="text-slate-400 text-center py-8">Enter JSON and click validate</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="convert-tab" class="tab-content flex-1 flex hidden">
        <div class="flex-1 flex flex-col p-4">
          <div class="flex gap-4 mb-4">
            <button id="toJsBtn" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm transition">
              JSON → JS Object
            </button>
            <button id="toJsonBtn" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm transition">
              JS Object → JSON
            </button>
            <button id="toYamlBtn" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm transition">
              JSON → YAML
            </button>
            <button id="toXmlBtn" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm transition">
              JSON → XML
            </button>
          </div>

          <div class="flex gap-4 flex-1">
            <div class="flex-1 flex flex-col">
              <span class="text-sm font-medium text-slate-500 mb-2">Input</span>
              <textarea id="convertInput" class="json-input flex-1 w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-800 resize-none" placeholder="Input data..."></textarea>
            </div>
            <div class="flex-1 flex flex-col">
              <span class="text-sm font-medium text-slate-500 mb-2">Output</span>
              <textarea id="convertOutput" class="json-input flex-1 w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-slate-50 dark:bg-slate-900 resize-none" readonly></textarea>
            </div>
          </div>
        </div>
      </div>

      <div id="tree-tab" class="tab-content flex-1 flex hidden">
        <div class="flex-1 flex gap-4 p-4">
          <div class="flex-1 flex flex-col">
            <textarea id="treeInput" class="json-input flex-1 w-full px-4 py-3 border border-slate-300 dark:border-slate-600 rounded-xl bg-white dark:bg-slate-800 resize-none" placeholder="Paste JSON to view as tree..."></textarea>
            <button id="renderTree" class="mt-4 px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg">
              <i class="fas fa-sitemap mr-2"></i>Render Tree
            </button>
          </div>
          <div class="flex-1 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-4 overflow-auto">
            <div id="treeView" class="font-mono text-sm">
              <p class="text-slate-400 text-center py-8">Enter JSON and click Render Tree</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        btn.classList.add('tab-active');
        document.getElementById(btn.dataset.tab + '-tab').classList.remove('hidden');
      });
    });

    // Format tab
    const jsonInput = document.getElementById('jsonInput');
    const jsonOutput = document.getElementById('jsonOutput');
    const indentSize = document.getElementById('indentSize');
    const statusText = document.getElementById('statusText');
    const statsText = document.getElementById('statsText');

    document.getElementById('pasteSample').addEventListener('click', () => {
      const sample = {
        name: "LocalForge",
        version: "1.0.0",
        tools: ["Image Editor", "JSON Tools", "QR Generator"],
        features: {
          localFirst: true,
          darkMode: true,
          offline: true
        },
        stats: {
          users: 1500,
          rating: 4.8
        }
      };
      jsonInput.value = JSON.stringify(sample);
      formatJson();
    });

    document.getElementById('clearJson').addEventListener('click', () => {
      jsonInput.value = '';
      jsonOutput.value = '';
      statusText.textContent = 'Ready';
      statsText.textContent = '';
    });

    document.getElementById('copyJson').addEventListener('click', () => {
      if (jsonOutput.value) {
        navigator.clipboard.writeText(jsonOutput.value);
        statusText.textContent = 'Copied to clipboard!';
        setTimeout(() => statusText.textContent = 'Ready', 2000);
      }
    });

    document.getElementById('downloadJson').addEventListener('click', () => {
      if (jsonOutput.value) {
        const blob = new Blob([jsonOutput.value], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'formatted.json';
        a.click();
        URL.revokeObjectURL(url);
      }
    });

    document.getElementById('minifyBtn').addEventListener('click', () => {
      try {
        const obj = JSON.parse(jsonInput.value);
        jsonOutput.value = JSON.stringify(obj);
        updateStats(obj);
        statusText.textContent = 'Minified successfully';
        statusText.className = 'text-green-600';
      } catch (e) {
        statusText.textContent = 'Error: ' + e.message;
        statusText.className = 'text-red-600';
      }
    });

    document.getElementById('formatBtn').addEventListener('click', formatJson);

    function formatJson() {
      try {
        const obj = JSON.parse(jsonInput.value);
        const indent = indentSize.value === '\\t' ? '\\t' : parseInt(indentSize.value);
        jsonOutput.value = JSON.stringify(obj, null, indent);
        updateStats(obj);
        statusText.textContent = 'Formatted successfully';
        statusText.className = 'text-green-600';
      } catch (e) {
        statusText.textContent = 'Error: ' + e.message;
        statusText.className = 'text-red-600';
      }
    }

    function updateStats(obj) {
      const str = JSON.stringify(obj);
      statsText.textContent = `${str.length} chars | ${Object.keys(obj).length} keys`;
    }

    indentSize.addEventListener('change', () => {
      if (jsonInput.value) formatJson();
    });

    // Validate tab
    const validateInput = document.getElementById('validateInput');
    const validationResult = document.getElementById('validationResult');

    document.getElementById('validateBtn').addEventListener('click', () => {
      try {
        const obj = JSON.parse(validateInput.value);
        const errors = validateObject(obj);

        if (errors.length === 0) {
          validationResult.innerHTML = `
            <div class="text-green-600 flex items-center gap-2">
              <i class="fas fa-check-circle text-2xl"></i>
              <div>
                <p class="font-bold">Valid JSON</p>
                <p class="text-sm text-slate-500">${Object.keys(obj).length} top-level keys</p>
              </div>
            </div>
          `;
        } else {
          validationResult.innerHTML = `
            <div class="text-yellow-600">
              <p class="font-bold mb-2"><i class="fas fa-exclamation-triangle mr-2"></i>Valid JSON with warnings:</p>
              <ul class="text-sm space-y-1">
                ${errors.map(e => `<li>• ${e}</li>`).join('')}
              </ul>
            </div>
          `;
        }
      } catch (e) {
        validationResult.innerHTML = `
          <div class="text-red-600 flex items-center gap-2">
            <i class="fas fa-times-circle text-2xl"></i>
            <div>
              <p class="font-bold">Invalid JSON</p>
              <p class="text-sm">${e.message}</p>
            </div>
          </div>
        `;
      }
    });

    document.getElementById('clearValidate').addEventListener('click', () => {
      validateInput.value = '';
      validationResult.innerHTML = '<p class="text-slate-400 text-center py-8">Enter JSON and click validate</p>';
    });

    function validateObject(obj, path = '') {
      const errors = [];

      for (const [key, value] of Object.entries(obj)) {
        const currentPath = path ? `${path}.${key}` : key;

        if (typeof key !== 'string') {
          errors.push(`${currentPath}: Key should be a string`);
        }
        if (typeof value === 'undefined') {
          errors.push(`${currentPath}: Value cannot be undefined`);
        }
        if (typeof value === 'function') {
          errors.push(`${currentPath}: Functions are not allowed in JSON`);
        }
        if (value !== null && typeof value === 'object') {
          errors.push(...validateObject(value, currentPath));
        }
      }

      return errors;
    }

    // Convert tab
    const convertInput = document.getElementById('convertInput');
    const convertOutput = document.getElementById('convertOutput');

    document.getElementById('toJsBtn').addEventListener('click', () => {
      try {
        const obj = JSON.parse(convertInput.value);
        convertOutput.value = JSON.stringify(obj, null, 2).replace(/"([^"]+)":/g, '$1:');
      } catch (e) {
        convertOutput.value = 'Error: ' + e.message;
      }
    });

    document.getElementById('toJsonBtn').addEventListener('click', () => {
      try {
        let str = convertInput.value;
        str = str.replace(/([{,]\\s*)([a-zA-Z_$][a-zA-Z0-9_$]*)\\s*:/g, '$1"$2":');
        const obj = eval('(' + str + ')');
        convertOutput.value = JSON.stringify(obj, null, 2);
      } catch (e) {
        convertOutput.value = 'Error: ' + e.message;
      }
    });

    document.getElementById('toYamlBtn').addEventListener('click', () => {
      try {
        const obj = JSON.parse(convertInput.value);
        convertOutput.value = jsonToYaml(obj);
      } catch (e) {
        convertOutput.value = 'Error: ' + e.message;
      }
    });

    document.getElementById('toXmlBtn').addEventListener('click', () => {
      try {
        const obj = JSON.parse(convertInput.value);
        convertOutput.value = jsonToXml(obj);
      } catch (e) {
        convertOutput.value = 'Error: ' + e.message;
      }
    });

    function jsonToYaml(obj, indent = 0) {
      const spaces = '  '.repeat(indent);
      let yaml = '';

      if (Array.isArray(obj)) {
        obj.forEach(item => {
          if (typeof item === 'object' && item !== null) {
            yaml += `${spaces}-\\n${jsonToYaml(item, indent + 1)}`;
          } else {
            yaml += `${spaces}- ${item}\\n`;
          }
        });
      } else if (typeof obj === 'object' && obj !== null) {
        for (const [key, value] of Object.entries(obj)) {
          if (typeof value === 'object' && value !== null) {
            yaml += `${spaces}${key}:\\n${jsonToYaml(value, indent + 1)}`;
          } else {
            yaml += `${spaces}${key}: ${value}\\n`;
          }
        }
      }

      return yaml;
    }

    function jsonToXml(obj, rootName = 'root') {
      function toXml(obj, name) {
        if (obj === null) return `<${name}></${name}>`;
        if (typeof obj !== 'object') return `<${name}>${obj}</${name}>`;

        let xml = `<${name}>`;
        for (const [key, value] of Object.entries(obj)) {
          xml += toXml(value, key);
        }
        xml += `</${name}>`;
        return xml;
      }

      return '<?xml version="1.0" encoding="UTF-8"?>\\n' + toXml(obj, rootName);
    }

    // Tree view tab
    const treeInput = document.getElementById('treeInput');
    const treeView = document.getElementById('treeView');

    document.getElementById('renderTree').addEventListener('click', () => {
      try {
        const obj = JSON.parse(treeInput.value);
        treeView.innerHTML = renderTree(obj);
      } catch (e) {
        treeView.innerHTML = `<p class="text-red-600">Error: ${e.message}</p>`;
      }
    });

    function renderTree(obj, level = 0) {
      const indent = '  '.repeat(level);

      if (obj === null) {
        return `<span class="json-null">null</span>`;
      }

      if (typeof obj !== 'object') {
        if (typeof obj === 'string') {
          return `<span class="json-string">"${obj}"</span>`;
        }
        if (typeof obj === 'number') {
          return `<span class="json-number">${obj}</span>`;
        }
        if (typeof obj === 'boolean') {
          return `<span class="json-boolean">${obj}</span>`;
        }
        return String(obj);
      }

      if (Array.isArray(obj)) {
        if (obj.length === 0) return '[]';

        let html = '[<br>';
        obj.forEach((item, i) => {
          html += `${indent}  ${renderTree(item, level + 1)}`;
          if (i < obj.length - 1) html += ',';
          html += '<br>';
        });
        html += `${indent}]`;
        return html;
      }

      const keys = Object.keys(obj);
      if (keys.length === 0) return '{}';

      let html = '{<br>';
      keys.forEach((key, i) => {
        html += `${indent}  <span class="json-key">"${key}"</span>: ${renderTree(obj[key], level + 1)}`;
        if (i < keys.length - 1) html += ',';
        html += '<br>';
      });
      html += `${indent}}`;
      return html;
    }
  </script>
</body>

</html>
